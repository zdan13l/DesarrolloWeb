<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de recursos · PontiReservas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(active='recursos')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar(crumbs='Recursos / <strong>Catálogo</strong>')}"></div>
    <div class="content">
      <div class="page-header">
        <div>
          <h1>Catálogo de recursos</h1>
          <p>Inventario de espacios y equipos del campus.</p>
        </div>
        <a class="btn primary" href="/recursos/nuevo">+ Nuevo recurso</a>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr><th>Recurso</th><th>Tipo</th><th>Categoría</th><th>Ubicación</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tbl-recursos"><tr><td colspan="6" class="empty-state">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  async function cargar() {
    const recursos = await api.get('/recursos');
    const body = document.getElementById('tbl-recursos');
    if (!recursos.length) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">No hay recursos registrados todavía.</td></tr>';
      return;
    }
    body.innerHTML = recursos.map(r => `
      <tr>
        <td><strong>${r.nombre}</strong></td>
        <td>${r.tipoRecurso}</td>
        <td>${r.categoriaNombre}</td>
        <td>${r.ubicacionNombre}</td>
        <td>${badge(r.estadoOperativo, ESTADO_RECURSO_BADGE[r.estadoOperativo] || 'gray')}</td>
        <td class="actions-cell">
          <a class="text-link" href="/recursos/${r.id}/editar">Editar</a>
          <button class="text-link" style="background:none;border:none;color:var(--red-text);cursor:pointer;padding:0;" onclick="eliminar(${r.id})">Eliminar</button>
        </td>
      </tr>`).join('');
  }

  async function eliminar(id) {
    if (!confirm('¿Eliminar este recurso?')) return;
    try {
      await api.del('/recursos/' + id);
      cargar();
    } catch (e) {
      alert('No se pudo eliminar: ' + e.message);
    }
  }

  cargar();
</script>
</body>
</html>
