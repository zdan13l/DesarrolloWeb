spring.application.name=sistema-gestion-api

spring.datasource.url=jdbc:h2:file:./data/sistema-gestion
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always

app.seguridad.jwt-secreto=${JWT_SECRETO:pontireservas-clave-de-desarrollo-reemplazar-en-produccion-0123456789}
app.seguridad.jwt-expiracion-horas=8

springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
